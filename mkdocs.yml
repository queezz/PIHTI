site_name: PIHTI Engineering Archive
site_description: Autodesk Inventor workspace for plasma, vacuum, and spectroscopy hardware
docs_dir: docs
site_dir: _site

# repo_url: https://github.com/queezz/PIHTI
# repo_name: queezz/PIHTI

theme:
  name: material
  logo: assets/pihtiicon.svg
  favicon: assets/pihtiicon.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.image.zoom
  palette:
    - scheme: bh-dark
      primary: custom
      accent: yellow
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: amber
      accent: orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

plugins:
  - search
  - glightbox

nav:
  - 🏠 Home: index.md
  - 🧭 Assembly Index: assembly-index.md
  - ⚙️ Systems:
    - 🔬 Plasma:
      - Plasma Vessel: systems/plasma-vessel.md
      - Sub-assemblies: systems/plasma-vessel-sub.md
      - PLD: systems/pld.md
    - 📡 Probes & Diagnostics:
      - Boron Probe: systems/boron-probe.md
      - PALP: systems/palp.md
      - PALP sub-assemblies: systems/palp-sub.md
      - LIBS: systems/libs.md
      - LIBS components: systems/libs-sub.md
    - 🌈 Spectroscopy:
      - Jobin-Yvon: systems/jobin-yvon.md
    - Vacuum Hardware:
      - TMP-PT-50 Adapters: systems/tmp-pt50.md
    - 🧰 Electronics:
      - Temp Controller v2: systems/electronics.md
      - Temp Controller: systems/temp-controllers.md
      - ESP32 Logger: systems/esp32-logger.md
      - Logger Rev1: systems/esp32-logger-rev1.md
      - Misc Enclosures: systems/electronics-misc.md
    - Support Hardware:
      - Sample Holder / Scaffolding / Desks: systems/support.md
    - Shared Library:
      - ContentCenter: systems/content-center.md
  - 🛠️ Working in this Repo:
    - Contributor Workflow: how-to-pr.md
    - Fabrication Notes: fabrication-notes.md
    - Drawings & PDFs: drawings.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - tables

extra_css:
  - styles/brand.css
