[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pihti-dedup"
version = "0.6.1"
description = "Duplicate review and guarded cleanup for the PIHTI Inventor workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "markdown>=3.6",
    "olefile>=0.47",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.12",
]
# Render a preview for CAD files that carry no embedded thumbnail. Absent,
# `geometry_preview.available_extensions()` shrinks and those files fall back
# to the neutral placeholder; nothing fails to import.
preview = [
    "numpy>=1.26",
    "pillow>=10.0",
]
# STEP tessellation, and 3MF as a bonus. cascadio ships an abi3 wheel, so
# there is nothing to compile, but it is ~46 MB installed. networkx and lxml
# are trimesh's own deferred 3MF dependencies: without them trimesh raises
# `ModuleNotFoundError` from inside the loader rather than at import time.
step = [
    "cascadio>=0.1.1",
    "trimesh>=4.0",
    "networkx>=3.0",
    "lxml>=5.0",
]

[project.scripts]
pihti-dedup = "pihti_dedup.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pihti_dedup"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
