[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pihti-dedup"
version = "0.2.0"
description = "Duplicate review and guarded cleanup for the PIHTI Inventor workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.12",
]

[project.scripts]
pihti-dedup = "pihti_dedup.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pihti_dedup"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
