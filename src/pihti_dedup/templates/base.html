<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>{% block title %}PIHTI CAD{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='pihtiicon.svg') }}">
  <link rel="stylesheet" href="{{ asset_url('dedup.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('catalog') }}" aria-label="PIHTI CAD catalog">
      <img class="brand-mark" src="{{ url_for('static', filename='pihtiicon.svg') }}" alt="" width="34" height="34">
      <span><strong>PIHTI</strong><small>CAD archive</small></span>
    </a>
    <nav class="topnav" aria-label="Views">
      <a href="{{ url_for('catalog') }}" {% if request.endpoint in ('catalog', 'part_page', 'folder_page') %}class="is-current" aria-current="page"{% endif %}>Catalog</a>
      <a href="{{ url_for('sourcing_all') }}" {% if request.endpoint in ('sourcing_all', 'sourcing_folder', 'sourcing_new', 'sourcing_edit') %}class="is-current" aria-current="page"{% endif %}>Sourcing</a>
      <a href="{{ url_for('duplicates') }}" {% if request.endpoint == 'duplicates' %}class="is-current" aria-current="page"{% endif %}>Duplicates</a>
      <a href="{{ url_for('doctor') }}" {% if request.endpoint in ('doctor', 'doctor_name', 'doctor_assembly', 'doctor_standard_parts') %}class="is-current" aria-current="page"{% endif %}>Doctor</a>
      <a href="{{ url_for('renames') }}" {% if request.endpoint == 'renames' %}class="is-current" aria-current="page"{% endif %}>Renames</a>
      <a href="{{ url_for('removed') }}" {% if request.endpoint == 'removed' %}class="is-current" aria-current="page"{% endif %}>Removed</a>
    </nav>
    <div class="topbar-meta">
      <span class="version">v{{ version }}</span>
    </div>
  </header>
  {% block body %}{% endblock %}
  <script src="{{ asset_url('viewer3d.js') }}" defer></script>
  <script src="{{ asset_url('dedup.js') }}" defer></script>
</body>
</html>
