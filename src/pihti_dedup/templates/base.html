<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>{% block title %}PIHTI CAD{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='dedup.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('catalog') }}" aria-label="PIHTI CAD catalog">
      <span class="brand-mark" aria-hidden="true">P</span>
      <span><strong>PIHTI</strong><small>CAD archive</small></span>
    </a>
    <nav class="topnav" aria-label="Views">
      <a href="{{ url_for('duplicates') }}" {% if request.endpoint == 'duplicates' %}class="is-current" aria-current="page"{% endif %}>Duplicates</a>
      <a href="{{ url_for('catalog') }}" {% if request.endpoint in ('catalog', 'part_page', 'folder_page') %}class="is-current" aria-current="page"{% endif %}>Catalog</a>
      <a href="{{ url_for('renames') }}" {% if request.endpoint == 'renames' %}class="is-current" aria-current="page"{% endif %}>Renames</a>
    </nav>
    <div class="topbar-meta">
      <span class="local-tool"><span aria-hidden="true">●</span> local quarantine</span>
      <span class="version">v{{ version }}</span>
    </div>
  </header>
  {% block body %}{% endblock %}
  <script src="{{ url_for('static', filename='dedup.js') }}" defer></script>
</body>
</html>
